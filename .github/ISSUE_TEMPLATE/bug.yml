name: Bug report
description: Something is broken.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What's the actual behavior, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Falsifiable, checkable conditions for "fixed".
      placeholder: |
        - [ ] ...
        - [ ] project builds
        - [ ] unit tests pass
    validations:
      required: true

  - type: dropdown
    id: executor
    attributes:
      label: Executor
      description: Who should pick this up? (mirrors the Project board "Executor" field)
      options:
        - Me
        - Claude
        - Codex
        - Other agent
    validations:
      required: false
