name: connectivity test release

on:
  push:
    branches:
      - feature/connectivity-diagnostics
  workflow_dispatch:

permissions:
  contents: write

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: setup jdk 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: make gradlew executable
        run: chmod +x ./gradlew

      - name: record TMDb key availability
        shell: bash
        run: |
          if [ -n "${TMDB_API_KEY}" ]; then
            echo "TMDB_KEY_STATUS=present" >> "$GITHUB_ENV"
          else
            echo "TMDB_KEY_STATUS=missing" >> "$GITHUB_ENV"
            echo "::warning::TMDB_API_KEY is not configured in this fork. The APK will build and launch, but TMDb-backed functionality will be limited."
          fi

      - name: detekt
        run: ./gradlew detekt

      - name: unit tests
        run: ./gradlew testFossDebugUnitTest

      - name: assemble GMS debug APK for Samsung/Google devices
        run: ./gradlew androidApp:assembleGmsDebug

      - name: locate APK
        shell: bash
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/gms/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_NAME=$(basename "$APK_PATH")" >> "$GITHUB_ENV"

      - name: enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: prepare Android startup smoke script
        shell: bash
        run: |
          cat > /tmp/movies-startup-smoke.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          PACKAGE="org.michaelbel.moviemade.debug"
          ACTIVITY="org.michaelbel.movies.MainActivity"
          COMPONENT="${PACKAGE}/${ACTIVITY}"

          adb install -r "$APK_PATH"
          adb logcat -c
          adb shell am force-stop "$PACKAGE" || true

          set +e
          START_OUTPUT=$(adb shell am start -W -n "$COMPONENT" 2>&1)
          START_EXIT=$?
          set -e
          printf '%s\n' "$START_OUTPUT"

          sleep 8
          adb logcat -d > startup-logcat.txt
          adb exec-out screencap -p > startup-screen.png || true
          grep -E "AndroidRuntime|FATAL EXCEPTION|MoviesConnectivity|org.michaelbel" startup-logcat.txt || true

          if [ "$START_EXIT" -ne 0 ]; then
            echo "::error::Activity launch command failed"
            exit 1
          fi

          if ! adb shell pidof "$PACKAGE" >/dev/null 2>&1; then
            echo "::error::Movies process is not alive after MainActivity launch"
            exit 1
          fi

          if grep -q "FATAL EXCEPTION" startup-logcat.txt && grep -q "Process: ${PACKAGE}" startup-logcat.txt; then
            echo "::error::Fatal exception detected while launching Movies"
            grep -A 40 -B 10 -E "FATAL EXCEPTION|Process: ${PACKAGE}" startup-logcat.txt || true
            exit 1
          fi

          if ! adb shell dumpsys activity activities | grep -q "mResumedActivity.*${PACKAGE}/${ACTIVITY}"; then
            echo "::error::Movies MainActivity is not the resumed foreground activity"
            adb shell dumpsys activity activities | grep -E "mResumedActivity|${PACKAGE}" || true
            exit 1
          fi

          echo "Startup smoke test passed: ${PACKAGE} is alive and MainActivity is resumed."
          EOF
          chmod +x /tmp/movies-startup-smoke.sh

      - name: Android 16 startup smoke test
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash /tmp/movies-startup-smoke.sh

      - name: upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: movies-connectivity-startup-diagnostics
          path: |
            startup-logcat.txt
            startup-screen.png
          if-no-files-found: ignore

      - name: upload test APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: movies-connectivity-gms-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="connectivity-test-${SHORT_SHA}"
          cat > /tmp/release-notes.md <<EOF
          Connectivity diagnostics test build for commit ${GITHUB_SHA}.

          - Variant: GMS debug (recommended for Samsung Galaxy / Google Play Services devices)
          - Android 16/API 36 startup smoke test: passed before publication
          - MainActivity foreground/resumed check: passed before publication
          - TMDb API key in CI: ${TMDB_KEY_STATUS}
          - Connectivity observer startup: fail-safe; observer failures cannot block app launch
          - Passive default-network observer: enabled
          - Active diagnostics: only after backend transport failure
          - Probe order: Movies domains/DNS first; generic gist endpoints only if all Movies endpoint probes fail
          - Debug package: org.michaelbel.moviemade.debug
          - Logcat tag: MoviesConnectivity

          This is a prerelease intended only for validation before opening an upstream pull request.
          EOF
          gh release create "$TAG" "${APK_PATH}#${APK_NAME}" \
            --target "$GITHUB_SHA" \
            --title "Movies connectivity GMS test ${SHORT_SHA}" \
            --notes-file /tmp/release-notes.md \
            --prerelease
