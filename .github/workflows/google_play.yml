name: Google Play

on:
  workflow_dispatch:

env:
  KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
  KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
  KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

concurrency:
  group: google-play-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Decode Keystore File
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/keystore_release.jks"
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Build GmsRelease Bundle
        run: ./gradlew androidApp:bundleGmsRelease

      - name: Upload Bundle to Google Play Production
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.michaelbel.moviemade
          releaseFiles: androidApp/build/outputs/bundle/gmsRelease/*.aab
          track: production
          status: completed
